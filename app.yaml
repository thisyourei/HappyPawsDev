runtime: python312
entrypoint: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 happypaws.wsgi:application

env_variables:
  DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: ".appspot.com,.run.app"

# Completar con la instancia real antes de desplegar en App Engine
# Formato: proyecto:region:nombre-instancia
# Ejemplo: happypawschl:us-central1:happypaws-db
beta_settings:
  cloud_sql_instances: "happypawschl:us-central1:happypaws-db"
