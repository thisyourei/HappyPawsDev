name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/happypaws-app:${{ github.sha }} .

      - name: Push Docker image
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/happypaws-app:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy happypaws-app \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/happypaws-app:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account yiokai-as@happypawschl.iam.gserviceaccount.com \
            --add-cloudsql-instances ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars "\
              DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }},\
              DB_NAME=${{ secrets.DB_NAME }},\
              DB_USER=${{ secrets.DB_USER }},\
              DB_PASSWORD=${{ secrets.DB_PASSWORD }},\
              CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }},\
              DJANGO_ALLOWED_HOSTS=.run.app,\
              DEBUG=False" \
            --quiet

      - name: Run database migrations
        run: |
          gcloud run jobs deploy happypaws-migrate \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/happypaws-app:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --service-account yiokai-as@happypawschl.iam.gserviceaccount.com \
            --add-cloudsql-instances ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars "\
              DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }},\
              DB_NAME=${{ secrets.DB_NAME }},\
              DB_USER=${{ secrets.DB_USER }},\
              DB_PASSWORD=${{ secrets.DB_PASSWORD }},\
              CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }},\
              DEBUG=False" \
            --command python \
            --args "manage.py,migrate" \
            --quiet
          gcloud run jobs execute happypaws-migrate \
            --region ${{ secrets.GCP_REGION }} \
            --wait \
            --quiet

      - name: Print Cloud Run URL
        run: gcloud run services describe happypaws-app --region ${{ secrets.GCP_REGION }} --format='value(status.url)'
